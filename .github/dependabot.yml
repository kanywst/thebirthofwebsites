version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    ignore:
      # vue-tsc still requires typescript/lib/tsc, which TS 7 dropped from its
      # package exports. Unpin once vue-tsc supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      vue-ecosystem:
        patterns:
          - "vue"
          - "vue-i18n"
          - "@vue/*"
          - "@vitejs/*"
      build-tooling:
        patterns:
          - "vite"
          - "vitest"
          - "typescript"
          - "vue-tsc"
          - "@biomejs/*"
          - "@types/*"
          - "happy-dom"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
      include: "scope"
